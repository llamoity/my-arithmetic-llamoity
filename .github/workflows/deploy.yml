name: Deploy

on:
  push:
    tags: ["*"]
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # startsWith(ref, 'refs/tags/') -> tag ; sinon c'est develop
      TARGET: ${{ startsWith(github.ref, 'refs/tags/') && 'stable' || 'develop' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install hatch
      - run: echo "${{ github.event.repository.name }} deployment on $TARGET servers"
      - run: hatch build
      - run: ls -l dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/
