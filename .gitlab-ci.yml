# Un seul pipeline par événement : sans ça, un push sur une branche avec une
# MR ouverte déclenche 2 pipelines (branch + merge_request_event).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages: [test, deploy]

variables:
  # hatch-vcs calcule la version via `git describe` : il faut tout l'historique
  # et les tags. Par défaut GitLab fait un clone superficiel (depth 20).
  GIT_DEPTH: 0
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

default:
  image: python:3.12
  cache:
    key: pip
    paths: [.cache/pip]
  before_script:
    - pip install hatch

test:
  stage: test
  script:
    - hatch test --cover
  # Regex appliquée au log du job -> % affiché dans les MR + badge "coverage".
  coverage: '/^TOTAL.*\s+(\d+(?:\.\d+)?)%$/'
  artifacts:
    reports:
      coverage_report:            # lignes couvertes/non couvertes dans le diff des MR
        coverage_format: cobertura
        path: coverage.xml

# Job "caché" (préfixe .) : jamais exécuté, sert de modèle via `extends`.
.deploy:
  stage: deploy
  script:
    - echo "$CI_PROJECT_NAME deployment on $TARGET servers"
    - hatch build
    - ls -l dist/
  artifacts:
    paths: [dist/]

deploy-stable:
  extends: .deploy
  variables:
    TARGET: stable
  rules:
    - if: $CI_COMMIT_TAG

deploy-develop:
  extends: .deploy
  variables:
    TARGET: develop
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
