# Fichier obligatoire pour Read the Docs (v2).
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # RTD clone en superficiel : on récupère les tags pour hatch-vcs.
    post_checkout:
      - git fetch --unshallow || true
      - git fetch --tags

python:
  install:
    - method: pip
      path: .
      extra_requirements: [docs]

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
